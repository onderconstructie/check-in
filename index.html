<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>De Mono-Minuut – Onder Constructie</title>
    <meta name="description" content="Eén minuut ongestoord spreken. Voor check-ins zonder interruptie.">
    <meta name="oc:groep" content="projecten">
    <meta name="oc:labels" content="vergaderen">
    <meta name="oc:kort" content="Rondje: elk één minuut aan het woord">
    <meta name="oc:volgorde" content="80">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox=&quot;0 0 40 40&quot; fill=&quot;none&quot; xmlns=&quot;http://www.w3.org/2000/svg&quot;%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;16&quot; fill=&quot;%23ecfdf5&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;1.5&quot;/%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;10&quot; fill=&quot;none&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;1.5&quot; opacity=&quot;0.5&quot;/%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;4&quot; fill=&quot;none&quot; stroke=&quot;%2310b981&quot; stroke-width=&quot;1.5&quot; opacity=&quot;0.3&quot;/%3E %3Ccircle cx=&quot;20&quot; cy=&quot;20&quot; r=&quot;2&quot; fill=&quot;%2310b981&quot;/%3E %3C/svg%3E">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
        :root {
            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --white: #ffffff;
            --accent: #10b981;
            --accent-light: #d1fae5;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', system-ui, sans-serif;
            background: var(--slate-50);
            color: var(--slate-700);
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--slate-200);
            padding: 1.25rem 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .back-link {
            position: absolute;
            left: 2rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--slate-400);
            text-decoration: none;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--accent);
        }

        .back-link svg {
            width: 16px;
            height: 16px;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .header-text h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--slate-800);
            letter-spacing: -0.02em;
        }

        .header-text p {
            font-size: 0.8125rem;
            color: var(--slate-500);
        }

        /* Main */
        .main {
            max-width: 600px;
            margin: 0 auto;
            padding: 3rem 2rem 4rem;
        }

        /* Card */
        .card {
            background: var(--white);
            border-radius: 16px;
            padding: 2.5rem;
            border: 1.5px solid var(--slate-200);
            text-align: center;
        }

        /* Check-in vraag */
        .check-in-question {
            font-size: 1.375rem;
            font-weight: 600;
            color: var(--slate-800);
            margin-bottom: 2rem;
            letter-spacing: -0.01em;
            transition: opacity 0.4s, color 0.4s;
        }

        .check-in-question.dimmed {
            opacity: 0.3;
            color: var(--slate-400);
        }

        /* Timer display */
        .timer-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 2rem;
        }

        .timer-ring-bg {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            border: 3px solid var(--slate-100);
        }

        .timer-canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }

        .timer-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .timer-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 4.5rem;
            font-weight: 700;
            color: var(--slate-800);
            line-height: 1;
            letter-spacing: -0.02em;
        }

        .timer-label {
            font-size: 0.875rem;
            color: var(--slate-400);
            margin-top: 0.25rem;
        }

        /* Status text */
        .status-text {
            font-size: 1.125rem;
            color: var(--slate-500);
            margin-bottom: 2rem;
            min-height: 1.75rem;
        }

        .status-text.active {
            color: var(--accent);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text.pulsing {
            animation: pulse 2s ease-in-out infinite;
        }

        /* Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem 2rem;
            border: none;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--white);
        }

        .btn-primary:hover:not(:disabled) {
            background: #0d9668;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: var(--slate-100);
            color: var(--slate-600);
            border: 1.5px solid var(--slate-200);
        }

        .btn-secondary:hover {
            background: var(--slate-200);
            border-color: var(--slate-300);
        }

        /* Hidden state */
        .hidden {
            display: none !important;
        }

        /* Fade animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 2rem;
        }

        .quote {
            font-size: 0.875rem;
            color: var(--accent);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .back-link {
                position: static;
                margin-bottom: 0.75rem;
            }
            
            .header {
                flex-direction: column;
                padding: 1rem 1.5rem;
            }
        }

        @media (max-width: 640px) {
            .main {
                padding: 2rem 1.25rem 3rem;
            }

            .card {
                padding: 2rem 1.5rem;
            }

            .timer-container {
                width: 240px;
                height: 240px;
            }

            .timer-value {
                font-size: 3.5rem;
            }
        }
    
        /* Onder Constructie: gedeelde footer en quote (huisstijl) */
        footer.oc-footer {
            text-align: center;
            padding: 2rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 2rem);
            margin-top: 2rem;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            color: #10b981;
        }

        footer.oc-footer .oc-quote {
            font-size: 0.8125rem;
            line-height: 1.5;
            color: #10b981;
            opacity: 1;
            font-style: normal;
            margin: 0;
        }
    
        /* ===== Huisstijl oktober 2026: kop (patroon B), contrast, focus, tikdoelen ===== */
        .oc-head { display:block; text-align:center; background:#fff; border-bottom:1px solid #e2e8f0; padding:1.5rem 1.25rem 1.75rem; position:relative; }
        .oc-head .back-link { position:absolute; top:0.875rem; left:1rem; min-height:44px; display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.5rem; margin:0; font-size:0.875rem; color:#64748b; text-decoration:none; border-radius:8px; transition:color 0.2s; }
        .oc-head .back-link:hover { color:#047857; }
        .oc-head .back-link svg { width:16px; height:16px; flex:none; }
        .oc-head .logo { display:block; width:56px; height:56px; margin:0 auto; }
        .oc-head .logo svg { display:block; width:56px; height:56px; }
        .oc-head .title { font-size:1.625rem; font-weight:700; color:#1e293b; letter-spacing:-0.03em; line-height:1.2; margin:0.5rem 0 0.25rem; }
        .oc-head .subtitle { font-size:0.9375rem; color:#64748b; max-width:520px; margin:0 auto; }
        @media (max-width:640px) {
            .oc-head { padding-top:0.5rem; }
            .oc-head .back-link { position:static; margin:0 auto 0.375rem; }
        }
        footer.oc-footer, footer.oc-footer .oc-quote, .footer .quote { color:#047857; }
        :focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }
        input[type=range]:focus-visible { outline:2px solid #047857 !important; outline-offset:4px; }
        .oc-import { color:#047857; min-height:44px; }
        .oc-import:focus-visible { outline-color:#047857; }
        .sr-only { position:absolute !important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

        .timer-label { color:#64748b; }
        .check-in-question.dimmed { opacity:1; color:#64748b; }
        .status-text.active { color:#065f46; }
        @keyframes pulse { 0%, 100% { opacity:1; } 50% { opacity:0.75; } }
        @media (prefers-reduced-motion: reduce) { .status-text.pulsing { animation:none; } }
        .btn { min-height:44px; }
        .btn-primary { background:#047857; color:#fff; border-radius:10px; font-size:15px; }
        .btn-primary:hover:not(:disabled) { background:#065f46; }
        @media (max-width:360px) { .timer-container { width:220px; height:220px; } }
    </style>
</head>
<body>
    <header class="header oc-head">
        <a href="https://onderconstructie.github.io/projectmanagement/" class="back-link" aria-label="Terug naar Projectmanagement">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Projectmanagement
        </a>
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="16" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
                    <circle cx="20" cy="20" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.5"/>
                    <circle cx="20" cy="20" r="4" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.3"/>
                    <circle cx="20" cy="20" r="2" fill="#10b981"/>
                </svg>
        </div>
        <h1 class="title">De Mono-Minuut</h1>
        <p class="subtitle">Rondje: elk één minuut aan het woord</p>
    </header>

    <main class="main">
        <div class="card">
            <!-- Check-in vraag -->
            <p id="checkInQuestion" class="check-in-question">Wat houdt je op dit moment bezig?</p>

            <!-- Timer -->
            <div class="timer-container">
                <div class="timer-ring-bg"></div>
                <canvas id="timerCanvas" class="timer-canvas" width="280" height="280" aria-hidden="true"></canvas>
                <div class="timer-center">
                    <span id="timerValue" class="timer-value">60</span>
                    <span class="timer-label">seconden</span>
                </div>
            </div>

            <!-- Status -->
            <p id="statusText" class="status-text" role="status" aria-live="polite">Klaar om te starten</p>

            <!-- Buttons -->
            <div id="startView">
                <button id="startBtn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    Start
                </button>
            </div>

            <div id="runningView" class="hidden">
                <button id="stopBtn" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="6" width="12" height="12" rx="1"/>
                    </svg>
                    Stop
                </button>
            </div>

            <div id="completeView" class="hidden fade-in">
                <button id="resetBtn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                        <path d="M3 3v5h5"/>
                    </svg>
                    Opnieuw
                </button>
            </div>
        </div>
    </main>

    <footer class="footer oc-footer">
        <p class="quote oc-quote">Spreken is zilver, luisteren is goud.</p>
    </footer>

    <script>
        // Elements
        const canvas = document.getElementById('timerCanvas');
        const ctx = canvas.getContext('2d');
        const timerValue = document.getElementById('timerValue');
        const statusText = document.getElementById('statusText');
        const checkInQuestion = document.getElementById('checkInQuestion');
        const startView = document.getElementById('startView');
        const runningView = document.getElementById('runningView');
        const completeView = document.getElementById('completeView');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resetBtn = document.getElementById('resetBtn');

        // Config
        const totalSeconds = 60;
        const centerX = canvas.width / 2;
        const centerY = canvas.height / 2;
        const radius = 130;

        // State
        let startTime = null;
        let animationId = null;
        let isRunning = false;

        // Draw the timer ring
        function drawRing(progress) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Calculate color - from bright green to faded
            const hue = 152; // emerald green
            const saturation = 76;
            const lightness = 30 + (progress * 20); // gets lighter as time passes
            const alpha = 1 - (progress * 0.6); // fades out
            
            // Draw arc (full circle minus progress)
            const startAngle = -Math.PI / 2; // Start at top
            const endAngle = startAngle + (2 * Math.PI * (1 - progress));
            
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.strokeStyle = `hsla(${hue}, ${saturation}%, ${lightness}%, ${alpha})`;
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.stroke();
        }

        // Update timer
        function updateTimer(currentTime) {
            if (!startTime) startTime = currentTime;
            
            const elapsed = (currentTime - startTime) / 1000;
            const remaining = Math.max(0, totalSeconds - elapsed);
            const progress = elapsed / totalSeconds;
            
            // Update display
            timerValue.textContent = Math.ceil(remaining);
            
            // Draw ring
            drawRing(progress);
            
            // Continue or complete
            if (remaining > 0) {
                animationId = requestAnimationFrame(updateTimer);
            } else {
                complete();
            }
        }

        // Start timer
        function start() {
            isRunning = true;
            startTime = null;
            
            startView.classList.add('hidden');
            runningView.classList.remove('hidden');
            completeView.classList.add('hidden');
            
            checkInQuestion.classList.add('dimmed');
            statusText.textContent = 'Luister... niet onderbreken.';
            statusText.classList.add('active', 'pulsing');
            
            animationId = requestAnimationFrame(updateTimer);
        }

        // Stop timer
        function stop() {
            isRunning = false;
            cancelAnimationFrame(animationId);
            
            runningView.classList.add('hidden');
            startView.classList.remove('hidden');
            
            checkInQuestion.classList.remove('dimmed');
            statusText.textContent = 'Klaar om te starten';
            statusText.classList.remove('active', 'pulsing');
            
            // Reset
            timerValue.textContent = '60';
            drawRing(0);
        }

        // Complete
        function complete() {
            isRunning = false;
            
            runningView.classList.add('hidden');
            completeView.classList.remove('hidden');
            completeView.classList.add('fade-in');
            
            statusText.textContent = 'Dankjewel.';
            statusText.classList.remove('pulsing');
        }

        // Reset
        function reset() {
            completeView.classList.add('hidden');
            startView.classList.remove('hidden');
            
            checkInQuestion.classList.remove('dimmed');
            statusText.textContent = 'Klaar om te starten';
            statusText.classList.remove('active');
            
            timerValue.textContent = '60';
            drawRing(0);
        }

        // Event listeners
        startBtn.addEventListener('click', start);
        stopBtn.addEventListener('click', stop);
        resetBtn.addEventListener('click', reset);

        // Keyboard: Space to start/reset
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // spatie op een knop of link laat de browser zelf afhandelen
                if (e.target.closest && e.target.closest('button, a, input, textarea, select')) return;
                e.preventDefault();
                if (!startView.classList.contains('hidden')) {
                    start();
                } else if (!completeView.classList.contains('hidden')) {
                    reset();
                }
            }
        });

        // Initial draw
        drawRing(0);
    </script>
</body>
</html>
