<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>De Mono-Minuut – Onder Constructie</title>
    <meta name="description" content="Iedereen om de beurt even ongestoord aan het woord. Kies zelf de vraag, de duur en de volgorde.">
    <meta name="oc:groep" content="projecten">
    <meta name="oc:labels" content="vergaderen">
    <meta name="oc:kort" content="Rondje: iedereen om de beurt aan het woord">
    <meta name="oc:volgorde" content="80">
    <meta name="oc:opslag" content="checkin.v1">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 40 40' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='20' cy='20' r='18' fill='%23f8fafc' stroke='%23e2e8f0' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='22' r='11' fill='%23fff' stroke='%2394a3b8' stroke-width='2'/%3E%3Cpath d='M20 22V14A8 8 0 1 1 13.07 26.00Z' fill='%2310b981'/%3E%3Cpath d='M17 7.5h6M20 7.5v3.5' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M29 12.5l1.8-1.8' stroke='%2364748b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="/fonts/fonts.css">
    <style>
        :root {
            --slate-50:#f8fafc; --slate-100:#f1f5f9; --slate-200:#e2e8f0; --slate-300:#cbd5e1; --slate-400:#94a3b8;
            --slate-500:#64748b; --slate-600:#475569; --slate-700:#334155; --slate-800:#1e293b; --wit:#ffffff;
            --accent:#10b981; --accent-dark:#047857; --accent-hover:#065f46; --accent-light:#d1fae5; --accent-50:#ecfdf5;
            --ring: clamp(180px, min(34vh, 66vw), 280px);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        [hidden] { display:none !important; }
        body { font-family:'DM Sans', system-ui, sans-serif; background:var(--slate-50); color:var(--slate-700); line-height:1.5; min-height:100vh; min-height:100dvh; -webkit-font-smoothing:antialiased; }
        button, input, textarea { font:inherit; color:inherit; }
        button { background:none; border:0; cursor:pointer; }

        /* Kop (huisstijl, patroon B) */
        .oc-head { display:block; text-align:center; background:#fff; border-bottom:1px solid #e2e8f0; padding:1.25rem 1.25rem 1.25rem; position:relative; }
        .oc-head .back-link { position:absolute; top:0.875rem; left:1rem; min-height:44px; display:inline-flex; align-items:center; gap:0.5rem; padding:0 0.5rem; font-size:0.875rem; color:#64748b; text-decoration:none; border-radius:8px; transition:color 0.2s; }
        .oc-head .back-link:hover { color:#047857; }
        .oc-head .back-link svg { width:16px; height:16px; flex:none; }
        .oc-head .logo { display:block; width:48px; height:48px; margin:0 auto; }
        .oc-head .logo svg { display:block; width:48px; height:48px; }
        .oc-head .title { font-size:1.5rem; font-weight:700; color:#1e293b; letter-spacing:-0.03em; line-height:1.2; margin:0.375rem 0 0.125rem; }
        .oc-head .subtitle { font-size:0.9375rem; color:#64748b; max-width:520px; margin:0 auto; }
        @media (max-width:640px) {
            .oc-head { padding:0.5rem 1rem 1rem; }
            .oc-head .back-link { position:static; margin:0 auto 0.25rem; }
            .oc-head .logo, .oc-head .logo svg { width:40px; height:40px; }
            .oc-head .title { font-size:1.375rem; }
        }

        .main { max-width:620px; margin:0 auto; padding:1rem 1rem 2rem; }
        .card { background:var(--wit); border-radius:16px; padding:1.25rem 1.25rem 1rem; border:1.5px solid var(--slate-200); text-align:center; transition:border-color 0.4s, box-shadow 0.4s; }
        .card.ended { border-color:#6ee7b7; box-shadow:0 0 0 4px var(--accent-50); }

        .question { font-size:1.25rem; font-weight:600; color:var(--slate-800); letter-spacing:-0.01em; line-height:1.35; word-break:break-word; }
        .turn { margin-top:0.5rem; font-size:1rem; color:var(--slate-600); font-variant-numeric:tabular-nums; }
        .turn b { color:var(--slate-800); font-weight:700; }
        .turn .sep { color:var(--slate-300); margin:0 0.375rem; }
        .turn .next { color:var(--slate-500); }

        /* Timer */
        .timer { position:relative; width:var(--ring); height:var(--ring); margin:0.75rem auto 0.75rem; }
        .timer-bg { position:absolute; inset:0; border-radius:50%; border:3px solid var(--slate-100); }
        .timer canvas { position:absolute; inset:0; width:100%; height:100%; }
        .timer-center { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .timer-value { font-variant-numeric:tabular-nums; font-size:calc(var(--ring) * 0.25); font-weight:700; color:var(--slate-800); line-height:1; letter-spacing:-0.02em; }
        .timer-label { font-size:0.9375rem; color:var(--slate-500); margin-top:0.25rem; }
        .timer.last .timer-value { color:#b45309; }
        .timer.done .timer-value { color:var(--accent-dark); }

        /* Knoppen */
        .controls { display:flex; flex-wrap:wrap; justify-content:center; gap:0.5rem; }
        .btn { display:inline-flex; align-items:center; justify-content:center; gap:0.5rem; min-height:44px; padding:0 1.125rem; border-radius:10px; font-size:0.9375rem; font-weight:600; white-space:nowrap; transition:background 0.15s; }
        .btn svg { width:18px; height:18px; flex:none; }
        .btn-primary { background:var(--accent-dark); color:#fff; min-width:8.5rem; }
        .btn-primary:hover { background:var(--accent-hover); }
        .btn-soft { background:var(--slate-100); color:var(--slate-700); }
        .btn-soft:hover { background:var(--slate-200); }
        .btn-ghost { color:var(--slate-600); }
        .btn-ghost:hover { background:var(--slate-100); }
        /* Lange naam op de knop "Volgende: …": inkorten in plaats van uit het scherm lopen */
        #next { max-width:100%; }
        #next span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
        .status { margin-top:0.625rem; font-size:0.9375rem; color:var(--slate-600); min-height:1.5em; }
        .status.active { color:#065f46; font-weight:600; }
        .hint { font-size:0.8125rem; color:var(--slate-500); margin-top:0.125rem; }
        kbd { font:inherit; font-size:0.75rem; font-weight:600; padding:0 0.375rem; border:1px solid var(--slate-300); border-bottom-width:2px; border-radius:5px; background:var(--slate-50); color:var(--slate-700); }

        /* Instellingen */
        .set { margin-top:0.75rem; border-top:1px solid var(--slate-100); text-align:left; }
        .set summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.375rem; min-height:44px; font-size:0.875rem; font-weight:600; color:var(--accent-dark); border-radius:8px; }
        .set summary::-webkit-details-marker { display:none; }
        .set summary svg { width:16px; height:16px; transition:transform 0.2s; }
        .set[open] summary svg { transform:rotate(180deg); }
        .set-body { display:flex; flex-direction:column; gap:1rem; padding:0.5rem 0 0.25rem; }
        .lbl { display:block; font-size:0.8125rem; font-weight:600; color:var(--slate-600); margin-bottom:0.375rem; }
        .lbl small { font-size:0.75rem; font-weight:400; color:var(--slate-500); }
        .field { width:100%; min-height:44px; padding:0.5625rem 0.75rem; border:1.5px solid var(--slate-200); border-radius:10px; background:var(--slate-50); font-size:1rem; outline:none; }
        .field:focus { border-color:var(--accent); background:#fff; }
        textarea.field { resize:vertical; min-height:5.5rem; line-height:1.45; }
        .chips { display:flex; flex-wrap:wrap; gap:0.375rem; align-items:center; }
        .chip { min-height:44px; padding:0 0.875rem; border-radius:999px; border:1px solid var(--slate-200); background:#fff; font-size:0.875rem; font-weight:600; color:var(--slate-600); font-variant-numeric:tabular-nums; }
        .chip:hover { border-color:var(--slate-300); }
        .chip[aria-pressed="true"] { background:var(--slate-800); border-color:var(--slate-800); color:#fff; }
        .own { display:inline-flex; align-items:center; gap:0.375rem; font-size:0.875rem; color:var(--slate-500); }
        .own input { width:4.5rem; min-height:44px; text-align:center; border:1.5px solid var(--slate-200); border-radius:10px; background:var(--slate-50); font-size:0.9375rem; font-variant-numeric:tabular-nums; outline:none; }
        .own input:focus { border-color:var(--accent); background:#fff; }
        .row { display:flex; flex-wrap:wrap; align-items:center; gap:0.375rem 0.75rem; margin-top:0.375rem; }
        .count { font-size:0.8125rem; color:var(--slate-500); font-variant-numeric:tabular-nums; margin-right:auto; }
        .link-btn { min-height:44px; padding:0 0.5rem; border-radius:8px; font-size:0.8125rem; font-weight:600; color:var(--accent-dark); display:inline-flex; align-items:center; gap:0.375rem; }
        .link-btn:hover { background:var(--accent-50); }
        .link-btn svg { width:15px; height:15px; }
        .switch-row { display:flex; align-items:center; justify-content:space-between; gap:1rem; font-size:0.9375rem; }
        .switch-row small { display:block; font-size:0.8125rem; color:var(--slate-500); }
        .switch { position:relative; flex:none; width:52px; height:44px; }
        .switch::before { content:''; position:absolute; left:4px; top:9px; width:44px; height:26px; border-radius:99px; background:var(--slate-300); transition:background 0.15s; }
        .switch::after { content:''; position:absolute; left:7px; top:12px; width:20px; height:20px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(15,23,42,0.2); transition:transform 0.15s; }
        .switch[aria-pressed="true"]::before { background:var(--accent-dark); }
        .switch[aria-pressed="true"]::after { transform:translateX(18px); }
        .reset-row { display:flex; justify-content:center; }
        .reset-btn { min-height:44px; padding:0.5rem 1rem; font-size:0.875rem; font-weight:500; color:#64748b; border-radius:10px; text-decoration:underline; text-decoration-color:#cbd5e1; text-underline-offset:3px; }
        .reset-btn:hover { color:#b91c1c; background:#fef2f2; }

        /* Groot scherm */
        .exit-present { display:none; position:fixed; top:0.75rem; right:0.75rem; z-index:30; background:#fff; border:1px solid var(--slate-200); box-shadow:0 4px 14px rgba(15,23,42,0.1); }
        body.present { background:#fff; }
        body.present .oc-head, body.present .oc-footer, body.present .set, body.present #present-btn, body.present .hint { display:none !important; }
        body.present .exit-present { display:inline-flex; }
        body.present .main { max-width:none; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        body.present .card { border:0; box-shadow:none; width:100%; max-width:1100px; padding:0; }
        body.present .card.ended { box-shadow:none; }
        body.present { --ring: clamp(220px, min(46vh, 80vw), 520px); }
        body.present .question { font-size:clamp(1.75rem, 3.6vw, 3rem); }
        body.present .turn { font-size:clamp(1.75rem, 3.4vw, 2.75rem); margin-top:0.75rem; }
        body.present .timer-label { font-size:clamp(1rem, 2vw, 1.5rem); }
        body.present .status { font-size:clamp(1.25rem, 2.4vw, 1.75rem); }
        body.present .btn { min-height:56px; font-size:1.125rem; padding:0 1.5rem; }

        /* Melding */
        .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom, 0px) + 1.25rem); transform:translate(-50%, calc(100% + 3rem)); visibility:hidden; z-index:50;
          background:var(--slate-800); color:#fff; border-radius:12px; padding:0.5rem 0.5rem 0.5rem 1rem; display:flex; align-items:center; gap:0.75rem; font-size:0.9375rem;
          box-shadow:0 10px 30px rgba(15,23,42,0.25); transition:transform 0.25s ease, visibility 0s 0.25s; max-width:calc(100% - 2rem); }
        .toast.show { transform:translate(-50%, 0); visibility:visible; transition:transform 0.25s ease; }
        .toast button { color:#6ee7b7; font-weight:600; min-height:44px; padding:0 0.625rem; border-radius:8px; }

        footer.oc-footer { text-align:center; padding:1.5rem 1.5rem calc(env(safe-area-inset-bottom, 0px) + 1.5rem); border-top:1px solid #e2e8f0; background:#fff; }
        footer.oc-footer .oc-quote { font-size:0.8125rem; line-height:1.5; color:#047857; margin:0; }

        :focus-visible { outline:2px solid #047857 !important; outline-offset:2px; }
        .oc-import { color:#047857; min-height:44px; }
        @keyframes soft { 0%, 100% { box-shadow:0 0 0 4px var(--accent-50); } 50% { box-shadow:0 0 0 10px var(--accent-light); } }
        .card.ended { animation:soft 1.6s ease-in-out 2; }
        body.present .card.ended { animation:none; }
        @media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
        @media (hover: none) and (pointer: coarse) { .hint { display:none; } }
        @media (forced-colors: active) { .chip[aria-pressed="true"], .switch[aria-pressed="true"] { border:2px solid Highlight; } }
    
/* Soepel op gsm: geen tikvertraging, eigen tikfeedback, grote startknop, velden van 16px (geen inzoomen) */
a, button, summary, label { touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.btn:active, .chip:active, .link-btn:active, .set summary:active { filter:brightness(0.93); }
@media (pointer: coarse) {
    .controls .btn { min-height:52px; }
    #go { min-height:56px; min-width:9.5rem; font-size:1.0625rem; }
    .own input { font-size:1rem; }
}
.oc-groot{width:44px;height:44px;min-width:44px;padding:0!important;display:inline-flex!important;align-items:center;justify-content:center;gap:0!important;flex:0 0 auto}.oc-groot svg{width:20px;height:20px;margin:0!important}
</style>
</head>
<body>
    <header class="header oc-head">
        <a href="https://onderconstructie.github.io/projectmanagement/#vergaderen" class="back-link" aria-label="Terug naar Vergaderen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            Vergaderen
        </a>
        <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="20" cy="20" r="18" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/><circle cx="20" cy="22" r="11" fill="#fff" stroke="#94a3b8" stroke-width="2"/><path d="M20 22V14A8 8 0 1 1 13.07 26.00Z" fill="#10b981"/><path d="M17 7.5h6M20 7.5v3.5" stroke="#64748b" stroke-width="2" stroke-linecap="round"/><path d="M29 12.5l1.8-1.8" stroke="#64748b" stroke-width="2" stroke-linecap="round"/></svg>
        </div>
        <h1 class="title">De Mono-Minuut</h1>
        <p class="subtitle">Rondje: iedereen om de beurt aan het woord</p>
    </header>

    <main class="main">
        <section class="card" id="card" aria-label="Rondje">
            <p class="question" id="question"></p>
            <p class="turn" id="turn" hidden></p>

            <div class="timer" id="timer">
                <div class="timer-bg"></div>
                <canvas id="canvas" aria-hidden="true"></canvas>
                <div class="timer-center">
                    <span class="timer-value" id="value" role="timer" aria-live="off">60</span>
                    <span class="timer-label" id="unit">seconden</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="go" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span>Start</span></button>
                <button class="btn btn-soft" id="next" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg><span>Volgende</span></button>
                <button class="btn btn-ghost" id="stop" type="button" hidden><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop</span></button>
                <button class="btn btn-ghost oc-groot" id="present-btn" type="button" title="Toon op groot scherm" aria-label="Toon op groot scherm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
            </div>
            <p class="status" id="status" role="status" aria-live="polite">Klaar om te starten</p>
            <p class="hint">Tip: druk op <kbd>Spatie</kbd> om te starten of te pauzeren.</p>

            <details class="set" id="set">
                <summary><span>Vraag, duur en sprekers</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></summary>
                <div class="set-body">
                    <label><span class="lbl">Vraag</span><input class="field" id="q-in" maxlength="160" placeholder="Wat houdt je op dit moment bezig?" enterkeyhint="done" autocomplete="off" autocapitalize="sentences"></label>
                    <div>
                        <span class="lbl" id="dur-lbl">Tijd per persoon</span>
                        <div class="chips" role="group" aria-labelledby="dur-lbl" id="chips">
                            <button type="button" class="chip" data-s="30" aria-pressed="false">30 s</button>
                            <button type="button" class="chip" data-s="60" aria-pressed="false">1 min</button>
                            <button type="button" class="chip" data-s="90" aria-pressed="false">1,5 min</button>
                            <button type="button" class="chip" data-s="120" aria-pressed="false">2 min</button>
                            <button type="button" class="chip" data-s="180" aria-pressed="false">3 min</button>
                            <label class="own">of <input id="own-s" type="number" inputmode="numeric" enterkeyhint="done" min="10" max="900" placeholder="…" aria-label="Eigen duur in seconden"> sec</label>
                        </div>
                    </div>
                    <div>
                        <label for="sp-in" class="lbl">Sprekers, in volgorde <small>(mag leeg blijven)</small></label>
                        <textarea class="field" id="sp-in" placeholder="Eén naam per regel, of gescheiden door komma's"></textarea>
                        <div class="row">
                            <span class="count" id="sp-count"></span>
                            <button type="button" class="link-btn" id="shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>Volgorde husselen</button>
                            <button type="button" class="link-btn oc-import" id="import-btn" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>Overnemen uit…</button>
                        </div>
                    </div>
                    <div class="switch-row">
                        <div>Subtiele ping op het einde<small>Op een gsm trilt hij ook even.</small></div>
                        <button type="button" class="switch" id="sound" aria-pressed="true" aria-label="Subtiele ping op het einde"></button>
                    </div>
                    <div class="reset-row"><button type="button" class="reset-btn" id="reset-all">Alles terugzetten</button></div>
                </div>
            </details>
        </section>
    </main>

    <button class="btn exit-present" id="exit-present" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Sluit groot scherm</button>

    <footer class="footer oc-footer">
        <p class="quote oc-quote">Spreken is zilver, luisteren is goud.</p>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"><span id="toast-text"></span><button type="button" id="toast-btn" hidden>Ongedaan</button></div>

    <script>
/* ---------- Overnemen tussen tools (gedeeld door de Onder Constructie-tools, v2) ----------
   Alle tools draaien op hetzelfde domein en delen dus localStorage. Elke tool legt wat hij te bieden
   heeft klaar onder 'oc.share.<tool-id>', in een vaste vorm, zodat andere tools het kunnen overnemen
   zonder elkaars binnenkant te kennen.

   Soorten (type):
     'betrokkene'  persoon, rol, stakeholder, doelgroep of team   { text, note? }
     'taak'        iets dat gedaan moet worden                     { text, note? }
     'actie'       taak met eigenaar en/of termijn                 { text, who?, when? }
     'risico'      risico met kans en impact                       { text, note? }

   Gebruik:
     ocShare.publish('raci', 'RACI-matrix', [
       { name:'Heraanleg stadspark', items:[ { type:'betrokkene', text:'Projectleider' }, { type:'taak', text:'Budget goedkeuren' } ] }
     ]);                                   // aanroepen na elke bewaring
     ocShare.clear('raci');                // bij "Alles wissen"
     const gekozen = await ocShare.pick({ types:['betrokkene'], self:'weerstand', title:'Doelgroepen overnemen' });
     // geeft [] terug bij annuleren, anders de aangevinkte items (met .source en .list erbij)
*/
const ocShare = (() => {
  const PREFIX = 'oc.share.';
  const LABEL = { betrokkene:'betrokkenen', taak:'taken', actie:'acties', risico:"risico's" };
  const esc = v => String(v == null ? '' : v).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));

  function publish(id, tool, lists) {
    try {
      const clean = (lists || []).map(l => ({
        name: String(l.name || '').slice(0, 80),
        items: (l.items || []).filter(i => i && i.type && String(i.text || '').trim())

/* ---------- Instellingen (bewaard op dit toestel) ---------- */
const KEY = 'checkin.v1';
